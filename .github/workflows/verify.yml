name: Verify firmware

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pico:
    name: Docker dual USB build and UART tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test UART transport and build host/device firmware
        run: docker build --target verify --tag pico-keyboard-verify:${{ github.sha }} .
