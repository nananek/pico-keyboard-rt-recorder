[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-keyboard-zero-recorder"
version = "0.1.0"
description = "Pi Zero recorder CLI for Pico Keyboard Real-time Recorder"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
zero-recorder = "app.cli:main"

[tool.setuptools]
packages = ["app"]
